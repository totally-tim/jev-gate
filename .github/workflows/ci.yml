name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install npm with the release-age guard
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const version = '12.0.2';
          const response = await fetch('https://registry.npmjs.org/npm', { signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error('Cannot verify npm release age');
          const metadata = await response.json();
          const published = Date.parse(metadata.time?.[version]);
          if (!Number.isFinite(published) || Date.now() - published < 172800000) throw new Error('npm release must be at least 48 hours old');
          execFileSync('npm', ['install', '--global', `npm@${version}`, '--ignore-scripts'], { stdio: 'inherit' });
          JS
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify the Action and CLI runtime on Node 24
        run: node --test dist/*.test.js plugin/dist/*.test.js
      - name: dist is current
        run: |
          if ! git diff --exit-code -- dist; then
            echo "dist/ is stale; run 'npm run build' and commit the result"
            exit 1
          fi
