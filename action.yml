name: jev-gate
description: >-
  Review a pull request with located JEV findings, verification steps, and explicit coverage.
author: Tim Kraus
branding:
  icon: shield
  color: purple
inputs:
  api-key:
    description: >-
      API key for the configured provider: a TypeSafe key or an OpenRouter key (store it
      as a repository secret). Pull requests from forks receive no secrets under the
      pull_request event; see the README for the pull_request_target option.
    required: false
  github-token:
    description: Token used to read the pull request and post the sticky comment.
    required: false
    default: ${{ github.token }}
  config-path:
    description: Path to the config file, read from the pull request's base commit.
    required: false
    default: .jev-gate.yml
  provider:
    description: >-
      Decisions provider: "typesafe" (the default) or "openrouter". Overrides the config file.
    required: false
  model:
    description: Jev model override; defaults to the config file or the provider's pinned default model.
    required: false
  comment:
    description: Set to "false" to skip the sticky comment and rely on the check and job summary.
    required: false
    default: "true"
  mode:
    description: 'Review policy: advisory or required. Overrides repository configuration.'
    required: false
  max-state-tokens:
    description: State token budget override; defaults to the config file or 24000.
    required: false
  max-requests:
    description: Maximum logical provider calls, 1 to 500; defaults to the config file or 64.
    required: false
  timeout-ms:
    description: Per-attempt timeout for the Jev call in milliseconds.
    required: false
    default: "30000"
outputs:
  health:
    description: Complete, partial, or unavailable review coverage.
  status:
    description: Clear, needs-review, incomplete, or unavailable.
  passed:
    description: '"true", "false", or "unavailable".'
  failed-gates:
    description: Comma-separated names of the gated rules that failed.
  result:
    description: The full review outcome as JSON.
runs:
  using: node20
  main: dist/bundle/action.cjs
