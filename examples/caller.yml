# Copy this file to .github/workflows/jev-gate.yml in a repository that should use the gate.
name: jev-gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jev-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  jev-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: totally-tim/jev-gate@v1
        with:
          # Either provider's key works here; set `provider` in .jev-gate.yml to choose.
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
